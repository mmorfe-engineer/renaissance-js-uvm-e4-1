name: Verificación académica
on:
  push:
    branches: [main, 'collaboration/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: API y audio reales (dependencia externa)
        run: node scripts/live-check.mjs
      - name: Empaquetar entrega
        if: always()
        run: npm run package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-y-entrega
          path: |
            artifacts/
            dist/*.zip
            dist/SHA256SUMS.json
